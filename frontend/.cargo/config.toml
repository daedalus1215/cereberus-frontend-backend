# Phones with 16 KB memory pages need a library aligned for them. NDK 27 aligns for 4 KB
# by default, and Android warns about that every time the debug app opens.
#
# This sits here rather than in src-tauri because cargo only looks in its working
# directory and the ones above it, and the Android build runs through npm, which starts
# here.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
